
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769e0">
<meta name="description" content="Indopedia - Temukan informasi, pengetahuan, dan berbagai hal menarik di internet.">
<title>Indopedia — Mesin Pencari</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #202124;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    width: 100%;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #1769e0;
    letter-spacing: -1px;
}

.logo span {
    color: #16a34a;
}

.header-link {
    text-decoration: none;
    color: #555;
    font-size: 14px;
}

.header-link:hover {
    color: #1769e0;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 100px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

.main-logo {
    font-size: clamp(45px, 10vw, 75px);
    font-weight: bold;
    letter-spacing: -4px;
    margin-bottom: 12px;
    color: #1769e0;
}

.main-logo span {
    color: #16a34a;
}

.subtitle {
    color: #64748b;
    font-size: 15px;
    margin-bottom: 32px;
}

.search-box {
    width: 100%;
    height: 54px;
    display: flex;
    align-items: center;
    border: 1px solid #dfe3e8;
    border-radius: 30px;
    padding: 0 18px;
    gap: 12px;
    transition: 0.2s;
    box-shadow: 0 2px 7px rgba(0,0,0,0.04);
}

.search-box:hover,
.search-box:focus-within {
    box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    border-color: transparent;
}

.search-icon {
    color: #64748b;
    font-size: 20px;
}

.search-box input {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: #202124;
    background: transparent;
}

.search-box input::placeholder {
    color: #9ca3af;
}

.clear-btn {
    display: none;
    background: none;
    border: none;
    color: #64748b;
    font-size: 21px;
    cursor: pointer;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.btn {
    padding: 12px 20px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: #f1f5f9;
    color: #334155;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.btn:hover {
    border-color: #cbd5e1;
    background: #e9eef5;
}

.btn.primary {
    background: #1769e0;
    color: white;
}

.btn.primary:hover {
    background: #0d55bd;
}

.quick-links {
    margin-top: 45px;
}

.quick-title {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 15px;
}

.links {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.link-item {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #475569;
    font-size: 13px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 10px 15px;
    border-radius: 10px;
    transition: 0.2s;
}

.link-item:hover {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1769e0;
}

.link-icon {
    font-size: 17px;
}

footer {
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    padding: 18px 6%;
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

footer span {
    color: #1769e0;
    font-weight: bold;
}

@media (max-width: 480px) {
    header {
        padding: 18px 5%;
    }

    .logo {
        font-size: 23px;
    }

    main {
        padding: 20px 18px 80px;
    }

    .main-logo {
        letter-spacing: -3px;
    }

    .subtitle {
        font-size: 13px;
    }

    .search-box {
        height: 50px;
        padding: 0 14px;
    }

    .search-box input {
        font-size: 14px;
    }

    .btn {
        padding: 11px 15px;
        font-size: 13px;
    }

    .link-item {
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Indo<span>pedia</span></div>
    <a class="header-link" href="https://www.wikipedia.org/"
       target="_blank">Pengetahuan</a>
</header>

<main>
    <div class="container">

        <div class="main-logo">
            Indo<span>pedia</span>
        </div>

        <p class="subtitle">
            Temukan informasi dan pengetahuan di seluruh internet
        </p>

        <form id="searchForm">
            <div class="search-box">
                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Cari apa saja di sini..."
                    autocomplete="off"
                    aria-label="Kolom pencarian"
                    required
                >

                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn"
                    aria-label="Hapus pencarian">×</button>
            </div>

            <div class="buttons">
                <button type="submit" class="btn primary">
                    Penelusuran Indo
                </button>

                <button type="button" class="btn" id="luckyBtn">
                    Saya Beruntung
                </button>
            </div>
        </form>

        <div class="quick-links">
            <p class="quick-title">Jelajahi internet</p>

            <div class="links">
                <a class="link-item"
                   href="https://www.youtube.com/"
                   target="_blank">
                    <span class="link-icon">▶</span>
                    YouTube
                </a>

                <a class="link-item"
                   href="https://www.wikipedia.org/"
                   target="_blank">
                    <span class="link-icon">📚</span>
                    Wikipedia
                </a>

                <a class="link-item"
                   href="https://www.google.com/"
                   target="_blank">
                    <span class="link-icon">🌐</span>
                    Google
                </a>

                <a class="link-item"
                   href="https://www.github.com/"
                   target="_blank">
                    <span class="link-icon">💻</span>
                    GitHub
                </a>
            </div>
        </div>

    </div>
</main>

<footer>
    <span>Indopedia</span> — Mesin pencari informasi Indonesia
    <br><br>
    © 2026 Indopedia. All rights reserved.
</footer>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const luckyBtn = document.getElementById("luckyBtn");

function searchIndo(lucky = false) {
    const query = input.value.trim();

    if (!query) {
        input.focus();
        return;
    }

    const url = "https://www.google.com/search?q=" +
                encodeURIComponent(query);

    if (lucky) {
        window.open(
            "https://www.google.com/search?btnI=1&q=" +
            encodeURIComponent(query),
            "_blank"
        );
    } else {
        window.open(url, "_blank");
    }
}

form.addEventListener("submit", function(event) {
    event.preventDefault();
    searchIndo(false);
});

luckyBtn.addEventListener("click", function() {
    searchIndo(true);
});

input.addEventListener("input", function() {
    clearBtn.style.display = input.value ? "block" : "none";
});

clearBtn.addEventListener("click", function() {
    input.value = "";
    clearBtn.style.display = "none";
    input.focus();
});

</script>

</body>
</html>
